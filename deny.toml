# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Vulnerability database (RustSec)
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rsa crate Marvin Attack (timing sidechannel). No upstream fix.
    # jsonwebtoken uses rsa for JWK decoding; NORA only verifies signatures.
    # Also transitive via pgp (rpgp): index signing is Ed25519-only, so no
    # rsa private-key operation is ever performed there either.
    "RUSTSEC-2023-0071",
    # quick-xml <0.41 DoS (quadratic-attr + NsReader memory-exhaustion).
    # Transitive via object_store (S3 XML parsing); no upstream fix yet
    # (object_store 0.14 still pins quick-xml <0.41). Low exposure: XML comes
    # from the configured S3 backend, not attacker input. Remove when
    # object_store ships quick-xml >=0.41. Tracking: #799
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # zip <9 `ZipArchive::extract` / `ZipStreamReader::extract`: symlink targets
    # outside the destination, Unix permissions applied through symlinks, SUID/SGID
    # bits preserved. NORA never extracts an archive to disk: wheel METADATA and
    # .nuspec are read by name with `by_name().take()` into memory, and ZipWriter
    # only produces test fixtures. Fix is the zip 3 -> 9 major bump, tracked
    # separately (maestra-io/nora, allocator-regression follow-up, 19.10.2026).
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
unused-allowed-license = "allow"
# Allowed open-source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "CDLA-Permissive-2.0",   # webpki-roots (CA certificates bundle)
    "MPL-2.0",
    "NCSA",  # libfuzzer-sys (LLVM fuzzer)
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl-sys" },
    { name = "openssl" },
]
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
