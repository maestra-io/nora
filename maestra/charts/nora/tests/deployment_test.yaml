suite: deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
# public_url is mandatory when ingress and httpRoute are both disabled. These
# tests render the Deployment (which embeds the configmap checksum) without an
# ingress, so supply public_url suite-wide. See the accepted note in values.yaml.
set:
  config.server.public_url: https://registry.example.com
tests:
  - it: renders a Deployment with default volumes
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: NORA_CONFIG_PATH
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /config
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: htpasswd

  - it: mounts htpasswd secret when configured
    template: templates/deployment.yaml
    set:
      config.auth.htpasswd.existingSecret: nora-htpasswd
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: htpasswd
            mountPath: /etc/nora
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: htpasswd
            secret:
              secretName: nora-htpasswd
              items:
                - key: users.htpasswd
                  path: users.htpasswd

  # Maestra (C76): nora never reads a secrets.toml; existingSecret is envFrom.
  - it: injects existingSecret as envFrom and mounts nothing for it
    template: templates/deployment.yaml
    set:
      existingSecret: nora-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: nora-secrets
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: secrets-config
            secret:
              secretName: nora-secrets

  - it: uses emptyDir for data when persistence is disabled
    template: templates/deployment.yaml
    set:
      persistence.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: uses PVC for data when persistence is enabled
    template: templates/deployment.yaml
    set:
      persistence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: RELEASE-NAME-nora-data

  - it: uses custom image tag
    template: templates/deployment.yaml
    set:
      image.tag: 0.9.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 515260921971.dkr.ecr.us-west-2.amazonaws.com/nora:0.9.0

  - it: uses chart appVersion when image tag is empty
    template: templates/deployment.yaml
    chart:
      appVersion: "9.8.7"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 515260921971.dkr.ecr.us-west-2.amazonaws.com/nora:9.8.7

  - it: sets replicaCount
    template: templates/deployment.yaml
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: injects extraEnv and extraEnvFrom
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: NORA_AUTH_ENABLED
          value: "true"
      extraEnvFrom:
        - secretRef:
            name: nora-env
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NORA_AUTH_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: nora-env

  - it: applies pod scheduling fields
    template: templates/deployment.yaml
    set:
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: dedicated
          operator: Equal
          value: registry
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: []
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: registry
            effect: NoSchedule
      - isNotNull:
          path: spec.template.spec.affinity.podAntiAffinity

  - it: applies security context and probes
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready

  - it: uses custom server port
    template: templates/deployment.yaml
    set:
      config.server.port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: mounts custom htpasswd secret key
    template: templates/deployment.yaml
    set:
      config.auth.htpasswd.existingSecret: my-htpasswd
      config.auth.htpasswd.secretKey: htpasswd
      config.auth.htpasswd.mountPath: /secrets/auth
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: htpasswd
            secret:
              secretName: my-htpasswd
              items:
                - key: htpasswd
                  path: htpasswd

  - it: includes config checksum annotation
    template: templates/deployment.yaml
    asserts:
      - isNotEmpty:
          path: spec.template.metadata.annotations.checksum/config

  - it: uses default service account when create is true
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-nora

  - it: uses custom service account name
    template: templates/deployment.yaml
    set:
      serviceAccount.name: external-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: external-sa

  - it: applies imagePullSecrets and resources
    template: templates/deployment.yaml
    set:
      imagePullSecrets:
        - name: ghcr-credentials
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: ghcr-credentials
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: applies pod labels and annotations
    template: templates/deployment.yaml
    set:
      podLabels:
        app: nora
      podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.labels.app
          value: nora
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: mounts htpasswd and injects existingSecret together with extraEnvFrom
    template: templates/deployment.yaml
    set:
      config.auth.htpasswd.existingSecret: nora-htpasswd
      existingSecret: nora-secrets
      extraEnvFrom:
        - configMapRef:
            name: nora-env
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: htpasswd
            mountPath: /etc/nora
            readOnly: true
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: nora-secrets
            - configMapRef:
                name: nora-env

  - it: adds extraVolumes and extraVolumeMounts
    template: templates/deployment.yaml
    set:
      extraVolumes:
        - name: ca
          configMap:
            name: corp-ca
      extraVolumeMounts:
        - name: ca
          mountPath: /etc/ssl/corp
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca
            configMap:
              name: corp-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ca
            mountPath: /etc/ssl/corp
            readOnly: true

  - it: does not mount curation volumes by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: curation-blocklist
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: curation-allowlist

  - it: mounts blocklist from an existing secret
    template: templates/deployment.yaml
    set:
      config.curation.blocklist.existingSecret: nora-blocklist
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: curation-blocklist
            mountPath: /etc/nora-curation/blocklist
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: curation-blocklist
            secret:
              secretName: nora-blocklist
              items:
                - key: blocklist.json
                  path: blocklist.json

  - it: mounts blocklist from an existing configmap
    template: templates/deployment.yaml
    set:
      config.curation.blocklist.existingConfigMap: nora-blocklist-cm
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: curation-blocklist
            configMap:
              name: nora-blocklist-cm
              items:
                - key: blocklist.json
                  path: blocklist.json

  - it: mounts allowlist from a secret with custom key and mountPath
    template: templates/deployment.yaml
    set:
      config.curation.allowlist.existingSecret: nora-allow
      config.curation.allowlist.key: allow.json
      config.curation.allowlist.mountPath: /opt/al
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: curation-allowlist
            mountPath: /opt/al
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: curation-allowlist
            secret:
              secretName: nora-allow
              items:
                - key: allow.json
                  path: allow.json

  - it: does not create a curation volume for an explicit path
    template: templates/deployment.yaml
    set:
      config.curation.mode: enforce
      config.curation.blocklist.path: /data/blocklist.json
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: curation-blocklist
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: curation-blocklist

  # Maestra: single-writer rollout (C13/C62/C68/C83)
  - it: uses Recreate, a preStop sleep and a grace period that covers the drain by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 40
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "5"]

  - it: drops the preStop hook when preStopSleepSeconds is 0
    template: templates/deployment.yaml
    set:
      preStopSleepSeconds: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: fails when the grace period cannot cover preStop + drain + scheduler wait
    template: templates/deployment.yaml
    set:
      terminationGracePeriodSeconds: 30
      config.server.shutdown_timeout: 20
    asserts:
      - failedTemplate:
          errorPattern: "terminationGracePeriodSeconds \\(30\\) must cover .* = 35"

  - it: pins the image by digest
    template: templates/deployment.yaml
    set:
      image.tag: 1.3.3-maestra.1
      image.digest: sha256:4892881d9ad4eea92055dd2178d7ffd6447a1782124510b315ebceac3b75768f
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 515260921971.dkr.ecr.us-west-2.amazonaws.com/nora:1.3.3-maestra.1@sha256:4892881d9ad4eea92055dd2178d7ffd6447a1782124510b315ebceac3b75768f

  # Maestra: what `helm template` of the published chart renders by default.
  - it: defaults to the ECR image of the release the chart was published with
    template: templates/deployment.yaml
    chart:
      version: 1.3.3-maestra.4
      appVersion: 1.3.3-maestra.4
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 515260921971.dkr.ecr.us-west-2.amazonaws.com/nora:1.3.3-maestra.4

  - it: defaults memory request to the limit and hardens the container
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: sets Deployment annotations
    template: templates/deployment.yaml
    set:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  # Maestra: s3 mode keeps the /data volume (C12/C72)
  - it: refuses s3 mode without persistence
    template: templates/deployment.yaml
    set:
      config.storage.mode: s3
      persistence.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "persistence.enabled=false with config.storage.mode=s3"

  - it: allows s3 mode on an emptyDir only when explicitly accepted
    template: templates/deployment.yaml
    set:
      config.storage.mode: s3
      persistence.enabled: false
      persistence.allowEphemeral: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: mounts the rotating S3 credentials Secret as a whole directory
    template: templates/deployment.yaml
    set:
      config.storage.mode: s3
      config.storage.s3Credentials.existingSecret: nora-r2-creds
      config.storage.s3Credentials.mountPath: /r2-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: s3-credentials
            mountPath: /r2-creds
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: s3-credentials
            secret:
              secretName: nora-r2-creds
              defaultMode: 288

  # R2-05: spools on their own size-limited emptyDir, never on the /data PVC.
  - it: mounts no spool volume by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spool
          any: true
      - notExists:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage

  - it: mounts the spool emptyDir with sizeLimit and matching ephemeral-storage
    template: templates/deployment.yaml
    set:
      spool.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spool
            emptyDir:
              sizeLimit: 4096Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spool
            mountPath: /spool
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 4096Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 5120Mi

  - it: keeps an explicit ephemeral-storage resource over the spool default
    template: templates/deployment.yaml
    set:
      spool.enabled: true
      spool.sizeLimitMb: 2048
      resources.limits.ephemeral-storage: 8Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: 8Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: 2048Mi
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spool
            emptyDir:
              sizeLimit: 2048Mi
