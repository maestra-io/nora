# Maestra: optional ingress/egress policy (R2-03)
suite: networkpolicy
templates:
  - templates/networkpolicy.yaml
set:
  config.server.public_url: https://registry.example.com
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a NetworkPolicy on the nora pods, ingress only without egress rules
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: traefik
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: nora
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: traefik
      - notExists:
          path: spec.egress

  - it: adds Egress to policyTypes when egress rules are set
    set:
      networkPolicy.enabled: true
      networkPolicy.egress:
        - ports:
            - port: 443
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress
          value: []
      - equal:
          path: spec.egress[0].ports[0].port
          value: 443

  - it: renders a CiliumNetworkPolicy with an endpointSelector
    set:
      networkPolicy.enabled: true
      networkPolicy.kind: CiliumNetworkPolicy
      networkPolicy.ingress:
        - fromEntities: [host, remote-node]
      networkPolicy.egress:
        - toEntities: [world]
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: apiVersion
          value: cilium.io/v2
      - equal:
          path: spec.endpointSelector.matchLabels
          value:
            app.kubernetes.io/name: nora
            app.kubernetes.io/instance: RELEASE-NAME
      - notExists:
          path: spec.podSelector
      - notExists:
          path: spec.policyTypes
      - equal:
          path: spec.ingress[0].fromEntities
          value: [host, remote-node]
      - equal:
          path: spec.egress[0].toEntities
          value: [world]

  - it: refuses another kind
    set:
      networkPolicy.enabled: true
      networkPolicy.kind: CalicoPolicy
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.kind must be NetworkPolicy or CiliumNetworkPolicy'

  - it: ci/maestra-values.yaml admits traefik, the Teleport agent and vmagent only
    values:
      - ../ci/maestra-values.yaml
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - lengthEqual:
          path: spec.ingress
          count: 3
      - equal:
          path: spec.ingress[0].fromEntities
          value: [host, remote-node]
      - equal:
          path: spec.ingress[1].fromEndpoints[0].matchLabels["k8s:io.kubernetes.pod.namespace"]
          value: teleport-maestra-agent
      - equal:
          path: spec.ingress[2].fromEndpoints[0].matchLabels["app.kubernetes.io/name"]
          value: vmagent
