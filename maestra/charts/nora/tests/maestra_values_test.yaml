# Maestra: ci/maestra-values.yaml must keep rendering everything the live
# packages.maestra.io config.toml (fluxcd iota/us-iota-lw-kube-infra/nora)
# sets; a key dropped from the values or the template fails here (R2-36/R2-44).
suite: maestra values
templates:
  - templates/configmap.yaml
  - templates/servicemonitor.yaml
  - templates/networkpolicy.yaml
  - templates/deployment.yaml
values:
  - ../ci/maestra-values.yaml
tests:
  - it: renders every live config.toml key
    template: templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[server\]\nhost = "0\.0\.0\.0"\nport = 4000\npublic_url = "https://packages\.maestra\.io"\nbody_limit_mb = 256\ninternal_port = 9100\nspool_dir = "/spool"\nspool_max_mb = 3584\ntrust_upstream_dates = true\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[registries\]\nenable = \["nuget", "npm", "pypi", "docker"\]\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[storage\]\nmode = "s3"\npath = "/data/storage"\ns3_url = "https://7409859d029eee9a1aa7b88360259e00\.r2\.cloudflarestorage\.com"\nbucket = "nora-packages-iota"\ns3_region = "auto"\ns3_credentials_dir = "/r2-creds"\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[gc\]\ndocker_proxy_cache_max_bytes = 322122547200\nenabled = true\ninterval = 86400\nproxy_cache_max_bytes = 107374182400\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[auth\]\nenabled = true\nhtpasswd_file = "/etc/nora/users\.htpasswd"\ntoken_storage = "/data/tokens"\nanonymous_read = false\ntrusted_proxies = "10\.60\.8\.0/24,10\.62\.0\.0/16"\nadmin_users = \["admin"\]\nhtpasswd_allowed_peers = "127\.0\.0\.1,::1"\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[auth\.teleport\]\ntrusted_proxies = "10\.62\.0\.0/16"\naudience = "http://nora-teleport\.nora\.svc\.cluster\.local:80"\nenabled = true\nissuer = "teleport\.maestra\.io"\njwks_url = "https://teleport\.maestra\.io/\.well-known/jwks\.json"\nrequire_for_ui = true\nwrite_roles = \["apps"\]\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[auth\.oidc\]\nenabled = true\nleeway_secs = 60\njwks_cache_secs = 300\n\n\[\[auth\.oidc\.providers\]\]\nname = "github-actions"\nissuer = "https://token\.actions\.githubusercontent\.com"\naudience = "packages\.maestra\.io"\nalgorithms = \["RS256"\]\nmax_token_lifetime_secs = 900\nenabled = true\nnamespace_scope = \["mindbox\.\*","maestra\.\*","@mindbox-cloud/\*","mindbox-ml-commons","python-mindbox-sdk","python-mindbox-chat-ast","mindbox-finance-mcp"\]\nnamespace_scope_enforcement = "enforce"\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'pattern = "repo:maestra-io/\*:ref:refs/heads/main"\nrole = "write"\n\n\[\[auth\.oidc\.providers\.role_rules\]\]\npattern = "repo:maestra-io/\*:ref:refs/heads/master"\nrole = "write"\n\n\[\[auth\.oidc\.providers\.role_rules\]\]\npattern = "repo:maestra-io@180315372/\*:ref:refs/heads/main"\nrole = "write"\n\n\[\[auth\.oidc\.providers\.role_rules\]\]\npattern = "repo:maestra-io@180315372/\*:ref:refs/heads/master"\nrole = "write"\n\n\[\[auth\.oidc\.providers\.role_rules\]\]\npattern = "repo:maestra-io/\*"\nrole = "read"\n\n\[\[auth\.oidc\.providers\.role_rules\]\]\npattern = "repo:maestra-io@180315372/\*"\nrole = "read"\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[audit\]\nmode = "stdout"\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[rate_limit\]\nenabled = true\nauth_rps = 1\nauth_burst = 5\nupload_rps = 200\nupload_burst = 500\ngeneral_rps = 100\ngeneral_burst = 200\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[curation\]\nmode = "audit"\non_failure = "closed"\nmin_release_age = "7d"\nquarantine = "observe"\nquarantine_ttl = "7d"\ninternal_namespaces = \["maestra\.\*","@mindbox-cloud/\*","mindbox-ml-commons","python-mindbox-sdk","python-mindbox-chat-ast","mindbox-finance-mcp"\]\n\n\[curation\.docker\]\nmin_release_age = "0d"\nquarantine = "observe"\nquarantine_ttl = "3d"\n\n\[curation\.nuget\]\nmin_release_age = "3d"\nquarantine_ttl = "3d"\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[docker\]\nproxy_timeout = 60\ndefault_action = "deny"\n\n\[\[docker\.upstreams\]\]\nurl = "https://registry-1\.docker\.io"\nprefix = "docker-hub"\nnamespace = "docker\.io"\nauth_env = "NORA_DOCKER_UPSTREAM_AUTH_0"\n\n\[\[docker\.upstreams\]\]\nurl = "https://ghcr\.io"\nprefix = "ghcr"\n\n\[\[docker\.upstreams\]\]\nurl = "https://registry\.k8s\.io"\nprefix = "k8s"\nnamespace = "registry\.k8s\.io"\n\n'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'auth = '

  - it: scrapes /metrics on the internal port (R2-53)
    template: templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: internal

  - it: admits vmagent on the internal port only, probes and proxies stay on 4000
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[0].toPorts[0].ports[0].port
          value: "4000"
      - equal:
          path: spec.ingress[1].toPorts[0].ports[0].port
          value: "4000"
      - equal:
          path: spec.ingress[2].fromEndpoints[0].matchLabels["app.kubernetes.io/name"]
          value: vmagent
      - equal:
          path: spec.ingress[2].toPorts[0].ports[0].port
          value: "9100"

  - it: passes the Docker Hub credential from its Secret, never through the ConfigMap
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NORA_DOCKER_UPSTREAM_AUTH_0
            valueFrom:
              secretKeyRef:
                name: nora-docker-hub
                key: auth

  - it: refuses an inline docker upstream credential
    template: templates/deployment.yaml
    set:
      config.docker.upstreams:
        - url: https://registry-1.docker.io
          auth: "user:token"
    asserts:
      - failedTemplate:
          errorPattern: "would put the credential in the ConfigMap"

  - it: keeps kubelet probes on the public port
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: internal
            containerPort: 9100
            protocol: TCP

  - it: runs without a PVC and leaves a lost node after 30 s
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: node.kubernetes.io/not-ready
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 30
            - key: node.kubernetes.io/unreachable
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 30
