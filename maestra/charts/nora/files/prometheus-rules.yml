# Prometheus alerting rules for NORA — the alerts documented in MONITORING.md.
#
# Load alongside your scrape config:
#
#   # prometheus.yml
#   rule_files:
#     - /etc/prometheus/prometheus-rules.yml
#
# Every metric used here is registered by nora-registry; the test
# `metrics::tests::prometheus_rules_use_registered_metrics` keeps it that way.
groups:
  - name: nora
    rules:
      - alert: NoraHighErrorRate
        expr: >-
          sum(rate(nora_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(nora_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NORA error rate above 5%"

      - alert: NoraHighLatency
        # Only above 5 rps: at night traffic is ~2 rps, so the p99 is a handful of
        # requests and one short storage stall fires it (23.10.2026, 7 slow npm
        # requests at 2.1 rps). Every real incident ran at 7-413 rps.
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(nora_http_request_duration_seconds_bucket[5m]))) > 5
          and on() sum(rate(nora_http_request_duration_seconds_count[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NORA p99 latency above 5s"
          runbook_url: "https://github.com/maestra-io/nora/blob/maestra/main/maestra/runbooks/NoraHighLatency.md"

      - alert: NoraCircuitBreakerOpen
        expr: nora_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NORA circuit breaker OPEN for {{ $labels.registry }}"

      - alert: NoraCacheLowHitRate
        expr: >-
          sum(rate(nora_cache_requests_total{result="hit"}[15m]))
          / sum(rate(nora_cache_requests_total[15m])) < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NORA cache hit rate below 50%"

      - alert: NoraUpstreamUrlLeak
        # 15m window, 5m for: a single leak keeps the increase positive long
        # enough to fire; a burst cleared by a fix resolves within 15m.
        expr: sum by (registry) (increase(nora_response_upstream_url_leak_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Upstream URL leak detected in NORA {{ $labels.registry }} responses"
          runbook_url: "https://github.com/maestra-io/nora/blob/maestra/main/maestra/runbooks/NoraUpstreamUrlLeak.md"
          description: >-
            A JSON response carried a configured upstream hostname: clients may
            bypass NORA. Find the WARN log line "upstream URL leak detected in
            response" (fields registry, upstream, path) and fetch that path: an
            upstream URL a client follows (registration, flatcontainer, tarball,
            file link) is a rewriter gap to fix. A URL kept on purpose (NuGet
            /v3/catalog0/) belongs in that registry's pass-through list
            (metrics::passthrough_paths), not in a silence.

      - alert: NoraCacheWriteErrors
        # Background cache writes (proxied artifacts, metadata) failing: requests
        # still succeed from upstream, but nothing is cached and an upstream
        # outage then becomes a NORA outage.
        expr: sum by (registry, operation) (increase(nora_cache_write_errors_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "NORA cache writes failing for {{ $labels.registry }} ({{ $labels.operation }})"

      - alert: NoraSpoolFailures
        # A proxied download, NuGet push or PyPI upload could not be spooled:
        # budget busy (503), body too large / volume full (507) or a local disk
        # error (500). Size server.spool_max_mb and the spool volume.
        expr: sum by (registry, reason) (increase(nora_spool_failures_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "NORA spool refusing transfers for {{ $labels.registry }} ({{ $labels.reason }})"

      - alert: NoraStorageWriteErrors
        expr: sum(increase(nora_storage_operations_total{operation=~"put|copy",status="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NORA storage writes failing"

      - alert: NoraStorageUnreachable
        # The readiness verdict: /ready answers 503 while this is 0.
        expr: nora_storage_reachable == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NORA storage backend unreachable (readiness failing)"

  - name: nora-integrity
    rules:
      - alert: NoraIntegrityFailure
        # `status` (not `result`) is the metric's label; matches
        # nora_storage_operations_total{operation="get",status="integrity_fail"}
        # and "verify_error" emitted by storage::Storage::get().
        expr: increase(nora_storage_operations_total{operation="get",status=~"integrity_fail|verify_error"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "NORA is refusing to serve an artifact (hash-pin integrity failure)"
          description: >-
            Storage get() failed closed on a hash-pin mismatch (bit rot or
            tampering); the artifact returns 5xx on every read. Find the key in
            the `integrity violation` error log, verify the on-disk bytes, then
            recover with `nora re-pin <key> --expected <sha256> --yes` (or
            restore from backup if the disk is genuinely corrupt).
