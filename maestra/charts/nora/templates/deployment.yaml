apiVersion: apps/v1
kind: Deployment
{{- $drain := int (.Values.config.server.shutdown_timeout | default 15) }}
{{- $needed := add (int .Values.preStopSleepSeconds) $drain 10 }}
{{- if lt (int .Values.terminationGracePeriodSeconds) $needed }}
{{- fail (printf "terminationGracePeriodSeconds (%d) must cover preStopSleepSeconds (%d) + config.server.shutdown_timeout (%d) + 10 s scheduler wait = %d, or the kubelet SIGKILLs nora before it drains audit and flushes tokens" (int .Values.terminationGracePeriodSeconds) (int .Values.preStopSleepSeconds) $drain $needed) }}
{{- end }}
{{- if and (eq .Values.config.storage.mode "s3") (not .Values.persistence.enabled) (not .Values.persistence.allowEphemeral) }}
{{- fail "persistence.enabled=false with config.storage.mode=s3 puts /data on an emptyDir: API tokens (auth.token_storage), the quarantine ledger and the audit file live there, not in the bucket, and every pod restart deletes them. Keep persistence.enabled=true, or set persistence.allowEphemeral=true to accept that." }}
{{- end }}
metadata:
  name: {{ include "nora.fullname" . }}
  labels:
    {{- include "nora.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nora.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nora.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nora.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "nora.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.preStopSleepSeconds }}
          # Keep serving while the endpoint removal reaches the ingress: nora
          # stops accepting the moment SIGTERM arrives (serve_with_drain).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port | default 4000 }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: NORA_CONFIG_PATH
              value: /config/config.toml
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.extraEnvFrom }}
          envFrom:
            {{- with .Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.config.auth.htpasswd.existingSecret }}
            - name: htpasswd
              mountPath: {{ .Values.config.auth.htpasswd.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.config.storage.s3Credentials.existingSecret }}
            # Whole-directory mount, no subPath: the kubelet swaps rotated
            # keys in place and nora re-reads them every 60 s.
            - name: s3-credentials
              mountPath: {{ .Values.config.storage.s3Credentials.mountPath }}
              readOnly: true
            {{- end }}
            {{- if or .Values.config.curation.blocklist.existingSecret .Values.config.curation.blocklist.existingConfigMap }}
            - name: curation-blocklist
              mountPath: {{ .Values.config.curation.blocklist.mountPath }}
              readOnly: true
            {{- end }}
            {{- if or .Values.config.curation.allowlist.existingSecret .Values.config.curation.allowlist.existingConfigMap }}
            - name: curation-allowlist
              mountPath: {{ .Values.config.curation.allowlist.mountPath }}
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "nora.fullname" . }}-config
        {{- if .Values.config.auth.htpasswd.existingSecret }}
        - name: htpasswd
          secret:
            secretName: {{ .Values.config.auth.htpasswd.existingSecret }}
            items:
              - key: {{ .Values.config.auth.htpasswd.secretKey }}
                path: {{ .Values.config.auth.htpasswd.secretKey }}
        {{- end }}
        {{- if .Values.config.storage.s3Credentials.existingSecret }}
        - name: s3-credentials
          secret:
            secretName: {{ .Values.config.storage.s3Credentials.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- $blocklist := .Values.config.curation.blocklist }}
        {{- if $blocklist.existingSecret }}
        - name: curation-blocklist
          secret:
            secretName: {{ $blocklist.existingSecret }}
            items:
              - key: {{ $blocklist.key | default "blocklist.json" }}
                path: {{ $blocklist.key | default "blocklist.json" }}
        {{- else if $blocklist.existingConfigMap }}
        - name: curation-blocklist
          configMap:
            name: {{ $blocklist.existingConfigMap }}
            items:
              - key: {{ $blocklist.key | default "blocklist.json" }}
                path: {{ $blocklist.key | default "blocklist.json" }}
        {{- end }}
        {{- $allowlist := .Values.config.curation.allowlist }}
        {{- if $allowlist.existingSecret }}
        - name: curation-allowlist
          secret:
            secretName: {{ $allowlist.existingSecret }}
            items:
              - key: {{ $allowlist.key | default "allowlist.json" }}
                path: {{ $allowlist.key | default "allowlist.json" }}
        {{- else if $allowlist.existingConfigMap }}
        - name: curation-allowlist
          configMap:
            name: {{ $allowlist.existingConfigMap }}
            items:
              - key: {{ $allowlist.key | default "allowlist.json" }}
                path: {{ $allowlist.key | default "allowlist.json" }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nora.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
