{{- with .Values.metrics.serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nora.fullname" $ }}
  labels:
    {{- include "nora.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      {{- include "nora.selectorLabels" $ | nindent 6 }}
  endpoints:
    # With server.internal_port the public port answers /metrics with 404 (R2-53).
    - port: {{ if $.Values.config.server.internal_port }}internal{{ else }}http{{ end }}
      path: /metrics
      interval: {{ .interval }}
      scrapeTimeout: {{ .scrapeTimeout }}
{{- end }}
{{- end }}
