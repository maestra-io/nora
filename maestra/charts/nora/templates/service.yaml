apiVersion: v1
kind: Service
metadata:
  name: {{ include "nora.fullname" . }}
  labels:
    {{- include "nora.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- with .Values.config.server.internal_port }}
    - port: {{ . }}
      targetPort: internal
      protocol: TCP
      name: internal
    {{- end }}
  selector:
    {{- include "nora.selectorLabels" . | nindent 4 }}
