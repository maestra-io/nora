{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if not (has $np.kind (list "NetworkPolicy" "CiliumNetworkPolicy")) }}
{{- fail (printf "networkPolicy.kind must be NetworkPolicy or CiliumNetworkPolicy, got %q" $np.kind) }}
{{- end }}
apiVersion: {{ ternary "cilium.io/v2" "networking.k8s.io/v1" (eq $np.kind "CiliumNetworkPolicy") }}
kind: {{ $np.kind }}
metadata:
  name: {{ include "nora.fullname" . }}
  labels:
    {{- include "nora.labels" . | nindent 4 }}
spec:
  {{- if eq $np.kind "CiliumNetworkPolicy" }}
  endpointSelector:
    matchLabels:
      {{- include "nora.selectorLabels" . | nindent 6 }}
  {{- else }}
  podSelector:
    matchLabels:
      {{- include "nora.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress }}
    - Egress
    {{- end }}
  {{- end }}
  ingress:
    {{- toYaml $np.ingress | nindent 4 }}
  {{- with $np.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
