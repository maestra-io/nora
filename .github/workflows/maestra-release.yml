name: Maestra release

# Builds the upstream Dockerfile (default Alpine target) from a maestra tag and
# pushes 515260921971.dkr.ecr.us-west-2.amazonaws.com/nora:<version>-maestra.N
# (tag without the leading v) for packages.maestra.io on us-iota-lw-kube-infra
# (maestra-io/issues-maestra#1442, W0a), then the vendored chart
# maestra/charts/nora as oci://.../charts/nora, version and appVersion = that tag. Upstream's own Release workflow also
# matches v* tags; it is disabled in this fork (see MAESTRA.md). Last, the
# release job creates or updates the GitHub Release for the tag.

concurrency: release-nora

on:
  push:
    tags: ['v*-maestra.*']
  # Re-run a failed push without retagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.3.3-maestra.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # GitHub OIDC -> Teleport image-push bot -> AWS STS

jobs:
  image:
    name: Build & push image to ECR
    runs-on: runs-on=${{ github.run_id }}/pool=build
    env:
      GIT_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      image: ${{ steps.image.outputs.ref }}
      chart: ${{ steps.chart.outputs.ref }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ env.GIT_TAG }}

      - name: Resolve image tag
        id: tag
        run: |
          case "$GIT_TAG" in
            v*-maestra.*) ;;
            *) echo "::error::${GIT_TAG} is not a v<version>-maestra.<n> tag"; exit 1 ;;
          esac
          tag="${GIT_TAG#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "${tag%-maestra.*}" != "$cargo_version" ]; then
            echo "::error::tag ${GIT_TAG} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "value=${tag}" >> "$GITHUB_OUTPUT"

      # --no-default-features: packages.maestra.io serves neither rpm nor deb, so
      # their parsers and the rpgp signer stay out of the image (~100 crates).
      # `mimalloc` is a default feature too, so it has to come back explicitly:
      # 1.3.6-maestra.1/.2 shipped without it and the musl allocator lock returned
      # (stime/utime 4.6, 0.03-0.07 core-s per request, NoraHighLatency x10, 16-19.10.2026).
      # The Dockerfile refuses a build whose binary has no mimalloc.
      - name: Build image
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker build --pull --build-arg CARGO_FEATURES="--no-default-features --features mimalloc" -t "local/nora:${TAG}" .

      - name: Push to ECR us-west-2
        uses: maestra-io/github-actions/push-to-aws-ecr-repository@8c2c0dd908663f5e9fc15844b050891610ee24c8 # v1.6.0
        with:
          awsRegion: us-west-2
          repositories: nora
          localTag: ${{ steps.tag.outputs.value }}
          targetTag: ${{ steps.tag.outputs.value }}

      - name: Report digest
        id: image
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          digest=$(aws ecr describe-images --region us-west-2 --repository-name nora \
            --image-ids imageTag="${TAG}" --query 'imageDetails[0].imageDigest' --output text)
          ref="515260921971.dkr.ecr.us-west-2.amazonaws.com/nora:${TAG}@${digest}"
          echo "${ref}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      # The chart goes out only after the image it points at is in ECR. Version
      # and appVersion = the image tag, so its default image (values.yaml
      # image.repository + appVersion) is exactly the image pushed above.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      # Reuses the AWS credentials the push action exported (image-push bot).
      # charts/nora is created like the action creates image repositories
      # (create-repository.sh: immutable tags, `latest` excluded) and gets the
      # nora image repository's org-wide policy, so the same principals pull both.
      - name: Push chart to ECR us-west-2
        id: chart
        env:
          TAG: ${{ steps.tag.outputs.value }}
          REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
        run: |
          set -euo pipefail
          helm package maestra/charts/nora --version "${TAG}" --app-version "${TAG}" --destination "${RUNNER_TEMP}"
          aws ecr describe-repositories --region us-west-2 --repository-names charts/nora >/dev/null 2>&1 || {
            policy=$(aws ecr get-repository-policy --region us-west-2 --repository-name nora --query policyText --output text)
            aws ecr create-repository --region us-west-2 --repository-name charts/nora \
              --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
              --image-tag-mutability-exclusion-filters 'filterType=WILDCARD,filter=latest' >/dev/null
            aws ecr set-repository-policy --region us-west-2 --repository-name charts/nora \
              --policy-text "${policy}" >/dev/null
          }
          aws ecr get-login-password --region us-west-2 | helm registry login "${REGISTRY}" --username AWS --password-stdin
          helm push "${RUNNER_TEMP}/nora-${TAG}.tgz" "oci://${REGISTRY}/charts"
          digest=$(aws ecr describe-images --region us-west-2 --repository-name charts/nora \
            --image-ids imageTag="${TAG}" --query 'imageDetails[0].imageDigest' --output text)
          ref="oci://${REGISTRY}/charts/nora:${TAG}@${digest}"
          echo "${ref}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

  # Runs only after image and chart are in ECR. Notes = PRs since the previous
  # v*-maestra.* tag (version order) plus the pushed artifacts; a re-run edits
  # the existing release. "Latest" only when the tag is the highest maestra tag.
  release:
    name: GitHub Release
    needs: image
    runs-on: runs-on=${{ github.run_id }}/pool=small
    permissions:
      contents: write
    env:
      GIT_TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ${{ needs.image.outputs.image }}
      CHART: ${{ needs.image.outputs.chart }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Create or update release
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^v[0-9.]+-maestra\.[0-9]+$' | sort -V)
          prev=$(printf '%s\n' "${tags}" | grep -B1 -xF "${GIT_TAG}" | grep -vxF "${GIT_TAG}" || true)
          latest=$([ "$(printf '%s\n' "${tags}" | tail -n1)" = "${GIT_TAG}" ] && echo true || echo false)
          notes="${RUNNER_TEMP}/notes.md"
          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="${GIT_TAG}" \
            ${prev:+-f previous_tag_name="${prev}"} --jq .body > "${notes}"
          # shellcheck disable=SC2016  # backticks are Markdown, not expansion
          printf '\n## Artifacts\n\n- Image: `%s`\n- Chart: `%s`\n' "${IMAGE}" "${CHART}" >> "${notes}"
          if gh release view "${GIT_TAG}" >/dev/null 2>&1; then
            gh release edit "${GIT_TAG}" --title "${GIT_TAG}" --notes-file "${notes}" --latest="${latest}"
          else
            gh release create "${GIT_TAG}" --verify-tag --title "${GIT_TAG}" --notes-file "${notes}" --latest="${latest}"
          fi
