name: Maestra sync Artifactory npm

# Imports the @mindbox-cloud/* npm versions that Artifactory npm-local has and
# packages.maestra.io does not host yet. GitLab pipelines still publish these
# libraries there (the RU contour), and their v<X.Y.Z> tags reach GitHub with the
# GitLab syncs, so semantic-release on GitHub never publishes those versions to
# nora; a consumer whose lockfile picked one up then fails `npm ci` with
# 403 blocked_by_policy (@mindbox-cloud/* is an internal namespace, never proxied).
# The import is byte-exact: each tarball is checked against the source's
# dist.integrity (sha512; a version without one fails the run) before the push,
# so lockfile integrity stays valid. A nora dist-tag is never moved back; a failed
# tag update fails the run. issues-maestra#1567.
#
# Credentials: the Artifactory read token from the central Vault (jwt-github role
# nora-artifactory-sync-github-ci, maestra/main only; fluxcd
# iota/us-iota-lw-kube-infra/vault-server/central-auth.yaml), and this run's
# GitHub OIDC token for nora (fluxcd nora role rule for maestra/main: write,
# namespace_scope mindbox.* and @mindbox-cloud/*).

# Manual only since 2026-10-21: the hourly import put Mindbox's GitLab builds into the
# same package names our GitHub semantic-release publishes, so the two version lines
# collided. maestra-io repos now sync from GitLab without its tags (skillz
# mindbox-upstream-sync), so GitHub releases every version they pin. Run on dispatch
# only for a one-off gap, and only after checking the version is not ours to release.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: maestra-sync-artifactory-npm
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: runs-on=${{ github.run_id }}/pool=small
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@v2.5.0

      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://vault.maestra.io
          method: jwt
          path: jwt-github
          role: nora-artifactory-sync-github-ci
          jwtGithubAudience: https://github.com/maestra-io
          secrets: |
            github/data/shared/artifactory/PRIVATE_PACKAGES_TOKEN value | ART_TOKEN ;

      - name: Install requests
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet requests==2.32.5

      - name: Import missing versions
        working-directory: maestra/scripts/import
        run: |
          NORA_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=packages.maestra.io" | jq -r .value)
          echo "::add-mask::$NORA_TOKEN"
          export NORA_TOKEN
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" enumerate.py --npm-missing-only --out "$RUNNER_TEMP/manifest.json"
          "$py" import.py --manifest "$RUNNER_TEMP/manifest.json" --state "$RUNNER_TEMP/state.jsonl" --formats npm --workers 4
          if [ -f "$RUNNER_TEMP/state.jsonl" ] && grep -q '"status": "failed"' "$RUNNER_TEMP/state.jsonl"; then
            echo "::error::some versions failed to import, see the log above"
            exit 1
          fi
