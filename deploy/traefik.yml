# =============================================================================
# Traefik reverse proxy configuration for NORA
# =============================================================================
#
# Two files are needed:
#   1. traefik.yml    -- static configuration (entry points, providers)
#   2. dynamic.yml    -- dynamic configuration (routers, services)
#
# Usage with Docker Compose:
#
#   services:
#     traefik:
#       image: traefik:v3
#       ports:
#         - "80:80"
#         - "443:443"
#       volumes:
#         - ./traefik.yml:/etc/traefik/traefik.yml:ro
#         - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
#         - /var/run/docker.sock:/var/run/docker.sock:ro
#         - certs:/etc/traefik/certs
#
#     nora:
#       image: getnora/nora:latest
#       environment:
#         NORA_HOST: "0.0.0.0"
#         NORA_PUBLIC_URL: "https://registry.example.com"
#         NORA_AUTH_TRUSTED_PROXIES: "172.16.0.0/12"
#       expose:
#         - "4000"
#
# =============================================================================

# --- traefik.yml (static configuration) ---

entryPoints:
  # No entry-point-wide redirect to https on :80: it would also answer API
  # clients (docker, npm, pip, nuget) configured with http://, whose credentials
  # have then already crossed the network in cleartext, and hide that mistake.
  # :80 has no routers, so those clients get a 404 and their owner switches them
  # to https://. Browsers get the optional nora-ui-redirect router below. Drop
  # this entry point entirely unless ACME HTTP-01 or that redirect needs it.
  web:
    address: ":80"
  websecure:
    address: ":443"
    # With its default readTimeout, Traefik v3 (measured on 3.7) ends a request
    # whose body takes longer than 60 s to arrive: a docker push of a large layer
    # over a slow link fails with 499 at that mark. 0 removes the limit; a value
    # longer than the slowest push you expect works too.
    transport:
      respondingTimeouts:
        readTimeout: 0

providers:
  file:
    filename: /etc/traefik/dynamic.yml

api:
  dashboard: false

log:
  level: WARN

# --- dynamic.yml (dynamic configuration) ---
