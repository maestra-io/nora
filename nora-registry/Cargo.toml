[package]
name = "nora-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cloud-Native Artifact Registry - Fast, lightweight, multi-protocol"
keywords = ["registry", "docker", "artifacts", "cloud-native", "devops"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[lib]
name = "nora_registry"
path = "src/lib.rs"

[[bin]]
name = "nora"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
reqwest.workspace = true
sha2.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha1 = "0.11"
md-5 = "0.11"
async-trait.workspace = true
hex.workspace = true
object_store = { version = "0.13", features = ["aws", "gcp"] }
futures = "0.3"
toml = "1.1"
# Lists config keys no field reads, so a typo is reported instead of ignored.
serde_ignored = "0.1"
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.19"
base64 = "0.22"
prometheus = "0.14"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
clap = { version = "4", features = ["derive"] }
tar = "0.4"
flate2 = "1.1"
indicatif = "0.18"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# axum only: the default features add tonic (gRPC), which nora does not serve.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor = "0.10"
parking_lot = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
argon2 = { version = "0.5", features = ["std", "rand"] }
tower-http = { version = "0.6", features = ["set-header", "catch-panic"] }
# The HTTP/1 and HTTP/2 server under axum, driven directly for the header and keep-alive
# timeouts axum::serve does not set; all three already in the tree through axum.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-graceful", "tokio"] }
tower = { version = "0.5", features = ["util"] }
percent-encoding = "2"
subtle = "2"
tokio-util = "0.7"
arc-swap = "1"
memchr = "2"
quick-xml = "0.41"
# Parses Helm repository index.yaml (helm proxy); panic-free, with alias/size budgets.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
# Signs the filtered Alpine APKINDEX (apk proxy; apk verifies RSA PKCS#1 v1.5 only).
# Already in the tree via jsonwebtoken/pgp; sha1/sha2 for its digest-0.10 hashing (the sha1 0.11 above is digest 0.11).
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
sha1_digest010 = { package = "sha1", version = "0.10", default-features = false, features = ["oid"] }
# Reads the .nuspec out of a pushed .nupkg; no other crate in the tree brings it.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Dual-stack TCP bind: clear IPV6_V6ONLY so a `::` listener also accepts IPv4 (#574).
socket2 = "0.6"
# rpm/deb format crates and the OpenPGP index signer: optional, see [features].
rpm = { version = "0.25", default-features = false, optional = true }
ar = { version = "0.9", optional = true }
lzma-rs = { version = "0.3", optional = true }
ruzstd = { version = "0.9", optional = true }
pgp = { version = "0.20", default-features = false, optional = true }
rand = "0.8"
# mimalloc as the global allocator (feature `mimalloc`, on by default). The static musl build
# uses musl's mallocng, which takes one global lock per allocation and collapses into kernel
# futex contention under many async workers; mimalloc's per-thread heaps remove it. The `no_thp`
# feature keeps idle/after-load RSS small and OS-returnable (default THP huge pages inflate it).
mimalloc = { version = "0.1", features = ["no_thp"], optional = true }

[target.'cfg(unix)'.dependencies]
# flock(2) on the local backend's staging lock, without unsafe; already in the tree
# through tempfile.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
# Paused clock for the tests of timers measured in seconds and minutes.
tokio = { workspace = true, features = ["test-util"] }
# Tests build real .rpm fixtures; payload+gzip stay out of the release binary.
rpm = { version = "0.25", default-features = false, features = ["payload", "gzip-compression"] }
proptest = "1"
tempfile = "3"
wiremock = "0.6"
criterion = { version = "0.8", features = ["html_reports"] }
http-body-util = "0.1"
insta = { version = "1", features = ["json"] }
# Reads `impl Storage` for the list test of the UI storage boundary, and every `cfg` of the
# sources for the test that no shipped build compiles fault-injection (already in the lock).
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[[bench]]
name = "parsing"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["md-5"]

[features]
default = ["rpm", "deb", "mimalloc"]
# Global allocator (see the `mimalloc` dependency). Build `--no-default-features` for the
# system allocator (musl's malloc on the static build).
mimalloc = ["dep:mimalloc"]
demo = []
# The rpm and deb registries (server, `nora mirror rpm|deb`, retention index
# rebuilds) with their parsers and the rpgp index signer they share: ~100 crates
# no other format needs. `--no-default-features` builds without them; a config
# that enables rpm/deb on such a build logs an error and does not mount them.
rpm = ["dep:rpm", "dep:pgp", "dep:lzma-rs", "dep:ruzstd"]
deb = ["dep:ar", "dep:pgp", "dep:lzma-rs", "dep:ruzstd"]
# `/__fi/` routes that make a handler, a background task or the maintenance loop panic or
# hang, for `scripts/release-panic-check.sh`. Never in a shipped build.
fault-injection = []
